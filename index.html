<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evaluación Interactiva: Estándares de Software</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            base: 'rgba(15, 23, 42, 0.75)',
                            card: 'rgba(30, 41, 59, 0.65)',
                            border: 'rgba(255, 255, 255, 0.12)',
                            glow: 'rgba(99, 102, 241, 0.25)'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }

        .glass-btn:active {
            transform: scale(0.98);
        }

        /* Estado de Opciones */
        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card.correct {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: #10b981 !important;
            color: #6ee7b7 !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .option-card.incorrect {
            background: rgba(239, 68, 68, 0.25) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .mesh-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* Prevenir desbordamientos móviles */
        * {
            box-sizing: border-box;
            max-width: 100%;
        }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between min-h-screen">

    <!-- Luces de fondo (Glow Effects) -->
    <div class="mesh-glow bg-indigo-600 top-0 -left-20"></div>
    <div class="mesh-glow bg-cyan-600 bottom-0 -right-20"></div>

    <div class="max-w-4xl mx-auto w-full z-10">
        
        <!-- Header Principal -->
        <header class="glass-panel rounded-2xl p-4 sm:p-6 mb-6 text-center relative overflow-hidden">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-semibold mb-2">
                <i class="fa-solid fa-graduation-cap"></i> SENA ADSO - Calidad de Software
            </div>
            <h1 class="text-xl sm:text-3xl font-extrabold tracking-tight text-white mb-2">
                Evaluación: Estándares & Ciclos de Vida
            </h1>
            <p class="text-xs sm:text-sm text-slate-300 max-w-xl mx-auto">
                ISO/IEC/IEEE 12207 • Modelos SDLC • IEEE 829 • ISO 37000
            </p>
        </header>

        <!-- Selector de Modo / Navegación Móvil -->
        <div class="grid grid-cols-2 gap-2 mb-6">
            <button onclick="setMode('exam')" id="btn-exam" class="glass-btn p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-indigo-500/50 bg-indigo-600/30 text-white">
                <i class="fa-solid fa-stopwatch text-indigo-400"></i> Modo Examen
            </button>
            <button onclick="setMode('study')" id="btn-study" class="glass-btn p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 text-slate-300">
                <i class="fa-solid fa-book-open text-cyan-400"></i> Modo Estudio
            </button>
        </div>

        <!-- Panel del Test -->
        <main id="quiz-container" class="glass-panel rounded-2xl p-4 sm:p-8 relative">
            
            <!-- Barra de Progreso e Info -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 mb-6 border-b border-slate-700/50 pb-4">
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
                    <span id="question-badge" class="px-3 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 text-xs font-bold border border-indigo-500/30">
                        Pregunta 1/25
                    </span>
                    <span id="timer" class="px-3 py-1 rounded-lg bg-amber-500/20 text-amber-300 text-xs font-bold border border-amber-500/30 hidden">
                        <i class="fa-regular fa-clock"></i> 20:00
                    </span>
                </div>
                <!-- Mini Barra de Estado -->
                <div class="w-full sm:w-48 bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Pregunta -->
            <h2 id="question-text" class="text-base sm:text-xl font-bold text-slate-100 mb-6 leading-relaxed">
                Cargando pregunta...
            </h2>

            <!-- Lista de Opciones (Responsive) -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Se generan dinámicamente -->
            </div>

            <!-- Explicación (Aparece tras responder) -->
            <div id="explanation-box" class="hidden p-4 rounded-xl bg-slate-900/80 border border-slate-700 text-xs sm:text-sm text-slate-200 mb-6 animate-fade-in">
                <div class="font-bold text-cyan-400 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb"></i> Explicación Técnica:
                </div>
                <p id="explanation-text"></p>
            </div>

            <!-- Botones de Control -->
            <div class="flex justify-between items-center gap-3 pt-2">
                <button id="btn-prev" onclick="prevQuestion()" class="glass-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-300 disabled:opacity-30">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Anterior
                </button>
                <button id="btn-next" onclick="nextQuestion()" class="glass-btn px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600/40 text-white hover:bg-indigo-600/60 border-indigo-400/40">
                    Siguiente <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </main>

        <!-- Pantalla de Resultados Finales -->
        <section id="results-container" class="glass-panel rounded-2xl p-6 text-center hidden">
            <div class="w-16 h-16 rounded-full bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center mx-auto mb-4 text-indigo-300 text-2xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-black mb-2">¡Evaluación Completada!</h2>
            <p class="text-xs sm:text-sm text-slate-400 mb-6">Resumen de desempeño obtenido:</p>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
                <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700">
                    <div class="text-xs text-slate-400">Puntaje</div>
                    <div id="final-score" class="text-xl sm:text-2xl font-black text-emerald-400">0/25</div>
                </div>
                <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700">
                    <div class="text-xs text-slate-400">Porcentaje</div>
                    <div id="final-percentage" class="text-xl sm:text-2xl font-black text-indigo-400">0%</div>
                </div>

            <button onclick="restartQuiz()" class="glass-btn px-6 py-3 rounded-xl text-sm font-bold bg-indigo-600 text-white w-full sm:w-auto">

            </button>
        </section>

    </div>

    <!-- Script del Motor de Preguntas y Evaluación -->
    <script>
        // Base de datos de 25 preguntas con opciones aleatorizadas
        const rawQuestions = [
            {
                q: "¿Cuál es el propósito principal del estándar ISO/IEC/IEEE 12207?",
                options: [
                    "Definir un marco común para los procesos del ciclo de vida del software.",
                    "Establecer plantillas únicas para las pruebas de software.",

                    "Garantizar que no existan errores sintácticos en el código."
                ],
                correct: 0,
                exp: "ISO/IEC/IEEE 12207 establece un marco de referencia estructurado para definir, controlar y mejorar los procesos del ciclo de vida del software."
            },
            {
                q: "¿Qué norma internacional define la estructura de documentación para pruebas de software (IEEE 829)?",
                options: [
                    "ISO 37000",
                    "IEEE 829",
                    "ISO/IEC 25010",
                    "CMMI Level 3"
                ],
                correct: 1,
                exp: "IEEE 829 es el estándar para la documentación de pruebas de software, especificando formatos como el Plan de Pruebas, Casos de Prueba e Informes."
            },
            {
                q: "En el contexto de ISO 37000, ¿cuál es el pilar fundamental que aborda esta norma?",
                options: [
                    "La arquitectura física de los servidores web.",
                    "La Gobernanza de las Organizaciones y decisiones estratégicas.",
                    "La optimización de bases de datos relacionales.",
                    "El diseño de interfaces responsivas UI/UX."
                ],
                correct: 1,
                exp: "ISO 37000 orienta a los órganos de gobierno sobre cómo guiar a las organizaciones de manera ética, responsable y eficiente."
            },
            {
                q: "Dentro del modelo de Ciclo de Vida en Cascada (Waterfall), ¿cuál es su principal característica?",
                options: [
                    "Permite realizar cambios ilimitados en cualquier fase del proyecto.",
                    "Es un enfoque secuencial donde cada fase depende de la finalización de la anterior.",
                    "Se basa en entregas diarias mediante sprints de 1 semana.",
                    "No requiere documentación ni diseño previo."
                ],
                correct: 1,
                exp: "El modelo en Cascada es rígido y secuencial: requisitos, diseño, implementación, verificación y mantenimiento en orden lineal."
            },
            {
                q: "Según IEEE 829, ¿qué documento contiene los pasos detallados, datos de entrada y resultados esperados?",
                options: [
                    "Plan de Pruebas (Test Plan)",
                    "Registro de Defectos (Bug Log)",
                    "Especificación de Caso de Prueba (Test Case Specification)",
                    "Informe de Cierre de Pruebas"
                ],
                correct: 2,
                exp: "La especificación de casos de prueba detalla las precondiciones, los pasos de ejecución exacta, los datos de prueba y los resultados esperados."
            },
            {
                q: "¿Qué grupo de procesos en ISO/IEC 12207 incluye la Adquisición y el Suministro?",
                options: [
                    "Procesos de Acuerdo (Agreement Processes)",
                    "Procesos Técnicos (Technical Processes)",
                    "Procesos de Proyecto",
                    "Procesos de Reutilización"
                ],
                correct: 0,
                exp: "Los Procesos de Acuerdo en ISO 12207 gestionan el establecimiento de contratos entre la entidad adquirente y el proveedor."
            },
            {
                q: "En el modelo Ágil (Scrum), ¿qué artefacto define las condiciones para considerar terminado un incremento?",
                options: [
                    "Definition of Done (DoD)",
                    "Matriz de Trazabilidad",
                    "Carta del Proyecto",
                    "Diagrama de Gantt"
                ],
                correct: 0,
                exp: "La Definición de Terminado (DoD) asegura que el incremento cumpla con todos los criterios de calidad y pruebas antes del release."
            },
            {
                q: "¿Cuál de las siguientes opciones describe mejor el concepto de Verification (Verificación)?",
                options: [
                    "¿Estamos construyendo el producto correcto para el usuario?",
                    "¿Estamos construyendo el producto correctamente según las especificaciones?",
                    "Auditoría externa de estados financieros.",
                    "Prueba de estrés masiva en producción."
                ],
                correct: 1,
                exp: "Verificación confirma si el software cumple con sus especificaciones técnicas ('¿Construimos el producto correctamente?')."
            },
            {
                q: "¿Cuál de las siguientes opciones describe el concepto de Validation (Validación)?",
                options: [
                    "Comprobar si las variables usan camelCase.",
                    "Confirmar que el software satisface las necesidades reales del usuario en su entorno.",
                    "Revisar que la base de datos esté normalizada en 3FN.",

                ],
                correct: 1,

            {
                q: "En IEEE 829, ¿cuál es la función de la Lista de Verificación / Criterios de Suspensión?",

            {
                q: "¿Qué modelo de ciclo de vida es más adecuado cuando los requisitos son altamente inciertos o cambian constantemente?",

                    "Despliegue Único Secuencial"

            {
                q: "¿Qué componente de ISO 37000 evalúa el impacto de la organización en la sociedad y el medio ambiente?",

                q: "Según ISO/IEC 12207, el proceso de 'Mantenimiento' se clasifica dentro de:",

                correct: 0,
                exp: "El informe de incidentes o Bug Log registra el ID del error, pasos para reproducirlo, severidad y estado de corrección."
            },
            {

            },
            {
                q: "Dentro de la gestión de calidad, ¿qué diferencia a QA (Aseguramiento) de QC (Control de Calidad)?",
                options: [
                    "QA se enfoca en el PROCESO (prevención); QC se enfoca en el PRODUCTO (detección).",
                    "QA es realizado por los clientes; QC es realizado por los programadores.",

                    "No existe ninguna diferencia técnica entre ambos."
                ],
                correct: 0,
                exp: "QA busca prevenir fallos mejorando los procesos; QC audita y prueba el producto final para detectar defectos."
            },
            {
                q: "¿Qué es la Matriz de Trazabilidad de Requisitos?",
                options: [
                    "Un documento que vincula cada requisito con sus pruebas y casos de uso correspondientes.",
                    "Un diagrama de flujo de la base de datos.",
                    "Un informe contable sobre el costo por hora de cada desarrollador.",
                    "Un archivo ejecutable de pruebas unitarias."
                ],
                correct: 0,
                exp: "La matriz de trazabilidad asegura que todos los requisitos tengan casos de prueba asociados y sean verificados."
            },
            {
                q: "En ISO 37000, los principios de 'Rendición de Cuentas' y 'Transparencia' pertenecen al ámbito de:",
                options: [
                    "Gobernanza Organizacional",
                    "Compilación de código",
                    "Instalación de drivers",
                    "Ventas al por menor"
                ],
                correct: 0,
                exp: "Son principios rectores de la gobernanza para asegurar que las decisiones organizacionales sean éticas y verificables."
            },
            {
                q: "En pruebas de software, ¿qué es un 'Valor Límite' (Boundary Value)?",
                options: [
                    "Valores situados en los extremos o bordes de las condiciones de entrada (ej. 0, 1, 100).",

                    "La cantidad máxima de líneas de código por archivo.",

                correct: 0,
                exp: "Las pruebas de valores límite evalúan las fronteras de validación, donde ocurre la mayor frecuencia de errores."

            {
                q: "¿Cuál es el objetivo de las Pruebas de Regresión?",
                options: [
                    "Verificar que los cambios recientes o correcciones no hayan roto funcionalidades previamente operativas.",
                    "Demoler la base de datos al finalizar el proyecto.",
                    "Traducir el código a un lenguaje anterior.",
                    "Evaluar la velocidad de escritura del programador."
                ],
                correct: 0,
                exp: "Las pruebas de regresión confirman que el código modificado no afecte negativamente áreas del software que ya funcionaban."
            },
            {
                q: "En el estándar ISO/IEC/IEEE 12207, el proceso de 'Revisión Conjunta' (Joint Review) busca:",
                options: [
                    "Evaluar el estado y los resultados de las actividades del proyecto entre las partes involucradas.",
                    "Programar en simultáneo con dos teclados.",
                    "Vender licencias de software a terceros.",
                    "Instalar actualizaciones del sistema operativo."
                ],
                correct: 0,
                exp: "Las revisiones conjuntas permiten que clientes y desarrolladores evalúen los avances técnicos y acuerdos del proyecto."
            },
            {
                q: "¿Qué es una Prueba Unitaria (Unit Test)?",
                options: [
                    "Prueba que verifica una función o componente aislado del código de manera individual.",
                    "Una prueba que involucra a todo el equipo de ventas.",
                    "Una auditoría de la infraestructura de red.",
                    "Un test de estrés con 10,000 usuarios simulados."
                ],
                correct: 0,
                exp: "La prueba unitaria valida el comportamiento de la unidad más pequeña de código probable de forma aislada."
            },
            {
                q: "¿Qué estándar se enfoca en el Proceso Personal de Software (PSP) para desarrolladores individuales?",
                options: [
                    "PSP (Personal Software Process)",
                    "ISO 9001",
                    "IEEE 829",
                    "Scrum Guide"
                ],
                correct: 0,
                exp: "PSP proporciona técnicas cuantitativas para que los desarrolladores gestionen su tiempo, estimaciones y calidad individual."
            },
            {
                q: "En IEEE 829, ¿qué significa que un caso de prueba sea 'Reproducible'?",
                options: [
                    "Que cualquier persona con las mismas precondiciones y pasos obtendrá siempre el mismo resultado.",
                    "Que puede duplicarse automáticamente en múltiples carpetas.",
                    "Que se graba en un archivo de audio MP3.",
                    "Que no requiere datos de entrada."
                ],
                correct: 0,
                exp: "Un caso reproducible garantiza consistencia: mismos datos e instrucciones producen el mismo resultado esperado."
            },
            {
                q: "Según las mejores prácticas de calidad, ¿por qué se recomienda que un desarrollador NO pruebe exclusivamente su propio código?",
                options: [
                    "Para evitar sesgos cognitivos y 'puntos ciegos' en la detección de fallos de su propia lógica.",
                    "Porque está prohibido por las leyes internacionales.",
                    "Porque los desarrolladores no saben usar navegadores.",
                    "Para duplicar el tiempo de cobro por hora."
                ],
                correct: 0,
                exp: "El creador del código tiende involuntariamente a omitir escenarios límite o asumir que sus flujos son infalibles (sesgo de autor)."
            }

        // Estado Global de la App
        let questions = [];
        let currentIndex = 0;
        let currentMode = 'exam'; // 'exam' o 'study'
        let userAnswers = {};
        let timeRemaining = 1200; // 20 min
        let timerInterval = null;

        // Inicializar App
        window.onload = function() {
            shuffleAndPrepareQuestions();
            renderQuestion();
            updateNavigation();
        };

        // Algoritmo de Aleatorización (Fisher-Yates) para Preguntas y Respuestas
        function shuffleAndPrepareQuestions() {
            // Clonar preguntas
            let cloned = JSON.parse(JSON.stringify(rawQuestions));
            
            // Mezclar preguntas
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }

            // Mezclar opciones de cada pregunta y reasignar índice correcto
            questions = cloned.map(item => {
                let optionsWithOriginalIndex = item.options.map((opt, idx) => ({
                    text: opt,
                    isCorrect: idx === item.correct
                }));

                // Mezclar opciones
                for (let i = optionsWithOriginalIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithOriginalIndex[i], optionsWithOriginalIndex[j]] = [optionsWithOriginalIndex[j], optionsWithOriginalIndex[i]];
                }

                return {
                    q: item.q,
                    options: optionsWithOriginalIndex.map(o => o.text),
                    correct: optionsWithOriginalIndex.findIndex(o => o.isCorrect),
                    exp: item.exp
                };
            });
        }

        // Cambiar Modo
        function setMode(mode) {
            currentMode = mode;
            const btnExam = document.getElementById('btn-exam');
            const btnStudy = document.getElementById('btn-study');
            const timerEl = document.getElementById('timer');

            if (mode === 'exam') {
                btnExam.className = "glass-btn p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-indigo-500/50 bg-indigo-600/30 text-white";
                btnStudy.className = "glass-btn p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 text-slate-300";
                timerEl.classList.remove('hidden');
                startTimer();
            } else {
                btnStudy.className = "glass-btn p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 border-cyan-500/50 bg-cyan-600/30 text-white";
                btnExam.className = "glass-btn p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 text-slate-300";
                timerEl.classList.add('hidden');
                clearInterval(timerInterval);
            }
            renderQuestion();
        }

        // Timer para Modo Examen
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                document.getElementById('timer').innerHTML = `<i class="fa-regular fa-clock"></i> ${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
            }, 1000);
        }

        // Renderizar Pregunta
        function renderQuestion() {
            const currentQ = questions[currentIndex];
            document.getElementById('question-badge').innerText = `Pregunta ${currentIndex + 1}/${questions.length}`;
            document.getElementById('question-text').innerText = currentQ.q;
            
            // Barra de Progreso
            const progressPct = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');

            const hasAnswered = userAnswers.hasOwnProperty(currentIndex);

            currentQ.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-card w-full text-left p-4 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-between gap-3 text-slate-200`;
                
                let iconHTML = `<span class="w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-slate-400 shrink-0">${String.fromCharCode(65 + optIdx)}</span>`;
                
                btn.innerHTML = `
                    <span class="leading-relaxed">${optText}</span>
                    ${iconHTML}
                `;

                // Si ya fue respondida (o en respuesta en modo estudio)
                if (hasAnswered) {
                    const selectedOpt = userAnswers[currentIndex];
                    if (optIdx === currentQ.correct) {
                        btn.classList.add('correct');
                        btn.innerHTML += `<i class="fa-solid fa-circle-check text-emerald-400 text-base shrink-0"></i>`;
                    } else if (optIdx === selectedOpt) {
                        btn.classList.add('incorrect');
                        btn.innerHTML += `<i class="fa-solid fa-circle-xmark text-rose-400 text-base shrink-0"></i>`;
                    }
                }

                btn.onclick = () => selectOption(optIdx);
                optionsContainer.appendChild(btn);
            });

            // Mostrar explicación si ya fue respondida en modo estudio
            if (hasAnswered && currentMode === 'study') {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-text').innerText = currentQ.exp;
            }
        }

        // Seleccionar Opción (Validación Visual)
        function selectOption(optIdx) {
            userAnswers[currentIndex] = optIdx;
            renderQuestion();
        }

        // Navegación
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
                updateNavigation();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                updateNavigation();
            }
        }

        function updateNavigation() {
            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            const btnNext = document.getElementById('btn-next');
            if (currentIndex === questions.length - 1) {
                btnNext.innerHTML = `Finalizar <i class="fa-solid fa-check ml-1"></i>`;
            } else {
                btnNext.innerHTML = `Siguiente <i class="fa-solid fa-arrow-right ml-1"></i>`;
            }
        }

        // Finalizar y Evaluar
        function finishQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz-container').classList.add('hidden');
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.classList.remove('hidden');

            let score = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) {
                    score++;
                }
            });

            const pct = Math.round((score / questions.length) * 100);

            document.getElementById('final-score').innerText = `${score}/${questions.length}`;
            document.getElementById('final-percentage').innerText = `${pct}%`;

            const statusEl = document.getElementById('final-status');
            if (pct >= 80) {
                statusEl.innerText = "¡Aprobado Excelente!";
                statusEl.className = "text-lg font-bold text-emerald-400";
            } else if (pct >= 60) {
                statusEl.innerText = "Aprobado Básico";
                statusEl.className = "text-lg font-bold text-amber-400";
            } else {
                statusEl.innerText = "Requiere Repaso";
                statusEl.className = "text-lg font-bold text-rose-400";
            }
        }

        // Reiniciar
        function restartQuiz() {
            userAnswers = {};
            currentIndex = 0;
            timeRemaining = 1200;
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            shuffleAndPrepareQuestions();
            renderQuestion();
            updateNavigation();
            if (currentMode === 'exam') startTimer();
        }
    </script>
</body>
</html>
